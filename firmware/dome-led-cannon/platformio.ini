; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@^6.8.1
framework = arduino
board = esp32dev
monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool
extra_scripts = 
	pre:write-compile-commands.py
build_flags = 
	-DCC=clang
	-DCXX=clang++
	-DLD=clang++
; TODO: Need a more recent framework-arduinoespressif32, the GNU-specific typeof
; extension does not play nicely with C++17
; 	-std=c++17
; build_unflags =
;   -std=gnu++11
lib_deps = 
	hideakitai/ArtNet@^0.8.0
	makuna/NeoPixelBus@^2.8.1
	https://github.com/tzapu/WiFiManager@^2.0.17
	WiFi @ ^2.0.0
